<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"/>
  <title>東海醫院掛號系統</title>

  <!-- CSS  -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/materialize.css' %}" type="text/css" rel="stylesheet" media="screen,projection"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css"/>
  <link rel="stylesheet" type="text/css" href="{% static 'css/hover.css' %}"/>
  <link href="https://gnehs.github.io/ChatUI/css/ChatUI.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" type="text/css" rel="stylesheet" media="screen,projection"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/sweetalert2@9.17.0/dist/sweetalert2.min.css"/>
</head>
<body>
	<div id="app">

        <div id="index-banner" class="container">
            <div class="section no-pad-bot">
              <div class="container">
                <div class="center-align">
                    <img class="responsive-img logo" src="{% static 'image/logo/logo.png' %}">
                </div>
              
				<h2 class="center-align"> <span id="title">財務管理系統</span></h2>

				<div class="row center">
				<a href="#" id="download-button" class="btn-large waves-effect waves-light teal lighten-1" @click="borrow()">登入/註冊</a>
				</div>
                <br><br>
        
              </div>
            </div>
          </div>

		  <div id="" class="container">
		  
			<div class="row">
				  <div class="col s12 m3">
					<div class="card">
					  <div class="card-image">
						<img src="{% static 'image/1.png' %}">
						<span class="card-title"></span>
					  </div>
					  <br>
					  <div class="card-content">
						<p>一般用戶由此進</p>
						<button data-target="modal1" class="btn right">進入</button>
						<br>
					</div>
					</div>
				  </div>
				  <div class="col s12 m3">
					<div class="card">
					  <div class="card-image">
						<img src="{% static 'image/4.png' %}">
						<span class="card-title"></span>
					  </div>
					  <br>
					  <div class="card-content">
						<p>需授權</p>
						<button class="btn right">進入</button>
						<br>
					</div>
					</div>
				  </div>
			</div>
			
			
		  </div>


	  <footer class="page-footer teal">
		<div class="container">
		  <div class="row">
			<div class="col l6 s12">
			  <h5 class="white-text" id="code">關於本網站</h5>
			  <p class="grey-text text-lighten-4">本網站由東海醫院資訊室管理。</p>
			</div>
			<div class="col l4 offset-l2 s12">
				<h5 class="white-text">聯絡資訊</h5>
				<ul>
					<li><a class="white-text" href="#!">abcd@gmail.com </a></li>
				</ul>
			</div>
		  </div>
		</div>
		<div class="footer-copyright">
		  <div class="container">
		  Made by <a class="brown-text text-lighten-3" href="http://materializecss.com">Materialize</a>
		  </div>
		</div>
	  </footer>
	</div>

  <!--  Scripts-->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script src="{% static 'js/materialize.js' %}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9.17.0/dist/sweetalert2.all.min.js" type="text/javascript" charset="utf-8"></script>
  <script src="{% static 'js/init.js' %}"></script>

  </body>
</html>
