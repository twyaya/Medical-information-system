{% extends 'base.html' %}
{% block content %}

<h1>費用結算</h1>
<form method="post">
    {% csrf_token %}
    <label for="appointment_id">掛號編號:</label>
    <input type="text" id="appointment_id" name="appointment_id" required><br>
    <label for="amount">金額:</label>
    <input type="number" id="amount" name="amount" step="10" required><br>
    <button type="submit">提交</button>
</form>

<h3>現有記錄</h3>
<table class="bordered responsive-table">
    <thead>
      <tr>
          <th data-field="date_created">產生日期</th>
          <th data-field="name">姓名</th>
          <th data-field="price">費用</th>
      </tr>
    </thead>

    <tbody>
        {% for record in records %}
      <tr>
        <td>{{ record.date_created }} </td>
        <td>{{ record.appointment.patient.name }} </td>
        <td>{{ record.amount }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
