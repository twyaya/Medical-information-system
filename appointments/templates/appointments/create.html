<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"/>
    <title>Create Appointment</title>
    
    <!-- CSS  -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/materialize.css' %}" type="text/css" rel="stylesheet" media="screen,projection"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/hover.css' %}"/>
    <link href="https://gnehs.github.io/ChatUI/css/ChatUI.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" type="text/css" rel="stylesheet" media="screen,projection"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/sweetalert2@9.17.0/dist/sweetalert2.min.css"/>
</head>
<body>
    <div class="container">
        <h1>Create Appointment</h1>
        <form method="post">
            {% csrf_token %}
            
            <!-- Patient Select Field -->
            <div class="input-field">
                <select name="patient_id" id="patient_id">
                    <option value="" disabled selected>Choose a patient</option>
                    {% for patient in patients %}
                        <option value="{{ patient.patient_id }}">{{ patient.name }} ({{ patient.patient_id }})</option>
                    {% endfor %}
                </select>
                <label for="patient_id">Patient:</label>

            </div>
            
            <!-- Doctor Select Field -->
            <div class="input-field">
                <select name="doctor_id" id="doctor_id">
                    <option value="" disabled selected>Choose a doctor</option>
                    {% for doctor in doctors %}
                        <option value="{{ doctor.doctor_id }}">{{ doctor.name }} ({{ doctor.doctor_id }})</option>
                    {% endfor %}
                </select>
                <label for="doctor_id">Doctor:</label>

            </div>
            <!-- Date Input Field -->
            <label for="date">Date:</label>

            <div class="input-field">
                <input type="datetime-local" id="date" name="date" required>
            </div>
            
            <!-- Description Textarea -->
            <div class="input-field">
                <label for="description">Description:</label>
                <textarea id="description" name="description" class="materialize-textarea"></textarea>
            </div>
            
            <!-- Submit Button -->
            <div class="center-align">
                <button type="submit" class="btn waves-effect waves-light">Create Appointment</button>
            </div>
        </form>
    </div>

    <!--  Scripts-->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="{% static 'js/materialize.js' %}"></script>
    <script>
        // Initialize Materialize components
        $(document).ready(function() {
            $('select').material_select();
        });
    </script>
</body>
</html>
